name: ci

# Cadence (2026-09-28, CONTRIBUTING.md "Release checks"): one scheduled run a day on the tip of dev,
# a run on each push to a pull request into main, a run each time main moves, and whatever anyone asks
# for by hand. Still no run per push to dev: that trigger used to fire on every push AND again on the
# same commit through the open dev -> main pull request, so one commit produced two runs and a red
# morning produced two notifications an hour. The per-commit gate is the pre-push hook, which runs the
# same checks in a clean worktree before anything reaches the remote. CI is what a promotion is gated
# on: scripts/promote_main.sh refuses to move main to a sha whose latest `test` run is not green, and
# main's branch rule names the same check as required (binding on admins only if the owner says so).
on:
  # GitHub runs schedules on the default branch, which is dev (repository setting, checked
  # 2026-09-28). The checkout below stays at github.sha rather than `ref: dev`, so the sha a run
  # records is the sha it tested; that pairing is what the promotion gate reads. The first step of
  # `test` fails the run if the default branch ever stops being dev, instead of silently testing
  # another branch.
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC, once a day; in September GitHub started it 4.5 to 7.3 hours late
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # main moves only by promotion (a fast-forward to a dev sha, at most once a day), so this is one run
  # per promotion, on the promoted sha where it lands, whatever route it took there; a record, not a gate
  push:
    branches: [main]
  workflow_dispatch:

# one run per branch at a time: a newer push cancels the run it supersedes
# instead of letting it finish and fail on code that no longer exists
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: The daily check is on dev
        if: github.event_name == 'schedule' && github.ref != 'refs/heads/dev'
        run: |
          echo "::error::the scheduled check ran on ${GITHUB_REF}, not refs/heads/dev; GitHub runs schedules on the default branch, and it is no longer dev"
          exit 1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra compose
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      # The shell scripts carry the commit and push guards and nothing linted them until
      # 2026-10-02: ruff is given a file list, and a .sh path named there is read as Python and
      # fails as one. GitHub's Ubuntu runners ship shellcheck, so this installs nothing. Locally
      # scripts/check.sh uses the runner's equivalent, a pinned PyPI wheel fetched on demand and
      # deliberately absent from pyproject: shellcheck is GPL-3.0 and this project's dependencies
      # are permissive-only, so it stays a dev tool that is never shipped or locked.
      - name: Lint the shell scripts
        run: shellcheck scripts/*.sh
      - name: Cache reference data
        uses: actions/cache@v4
        with:
          path: |
            data/reference/chrM.fa.gz
            data/reference/chr21.fa.gz
            data/knowledge/go-basic.obo
            data/knowledge/goa_human.gaf.gz
            data/knowledge/cl-basic.obo
          key: refdata-v1
      - name: Fetch small reference data (~60 MB; distilled summaries cover the rest)
        run: |
          mkdir -p data/reference data/knowledge
          [ -s data/reference/chrM.fa.gz ] || curl -sL --fail -o data/reference/chrM.fa.gz https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chrM.fa.gz
          [ -s data/reference/chr21.fa.gz ] || curl -sL --fail -o data/reference/chr21.fa.gz https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chr21.fa.gz
          [ -s data/knowledge/go-basic.obo ] || curl -sL --fail -o data/knowledge/go-basic.obo https://current.geneontology.org/ontology/go-basic.obo
          [ -s data/knowledge/goa_human.gaf.gz ] || curl -sL --fail -o data/knowledge/goa_human.gaf.gz https://current.geneontology.org/annotations/goa_human.gaf.gz
          [ -s data/knowledge/cl-basic.obo ] || curl -sL --fail -o data/knowledge/cl-basic.obo http://purl.obolibrary.org/obo/cl/cl-basic.obo
      - name: Test
        run: uv run pytest -q -rs
      - name: BioLang programs test themselves
        run: uv run bio test data/demo genomeos/std data/organisms

  # The same suite on an environment holding only what the project declares (2026-10-02). Ten tests
  # passed, for as long as they existed, only because somebody had once installed pandas and openpyxl
  # into one checkout by hand. `test` above could not see it: it installs `--extra compose`, and eight
  # locked packages pull pandas in behind that one flag, so seven of the ten were green for a reason
  # unrelated to this project declaring pandas; openpyxl arrives only with biolearn in the `clocks`
  # extra, which no job installs, so the other three had never run in CI at all. The pre-push hook could
  # not see it either, because its clean worktree borrows this checkout's .venv (scripts/pre-push.sh,
  # UV_NO_SYNC=1) -- the very environment the hand-installed packages were in. So CI is the place.
  #
  # `uv sync --frozen` and nothing else: the lock, the default dev group, no extra. A test that
  # genuinely needs an extra says so with `@pytest.mark.requires_extra("<name>")` and skips here by that
  # declaration, naming the extra (tests/conftest.py); `-rs` prints every skip, so what this job does
  # not run is on the record rather than invisible, and tests/test_extra_only_imports.py fails on an
  # import-time import of an extra-only package that carries no such marker. The reference data is
  # fetched exactly as `test` fetches it, from the same cache key, because the one difference between
  # the two jobs has to be the installed packages. Linting is not repeated: `test` does that.
  #
  # Not a required check. That is main's branch protection, which is the owner's alone, and the request
  # goes on his list once this job has run green twice.
  test-bare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install what the project declares, and nothing else
        run: uv sync --frozen
      - name: Cache reference data
        uses: actions/cache@v4
        with:
          path: |
            data/reference/chrM.fa.gz
            data/reference/chr21.fa.gz
            data/knowledge/go-basic.obo
            data/knowledge/goa_human.gaf.gz
            data/knowledge/cl-basic.obo
          key: refdata-v1
      - name: Fetch small reference data (~60 MB; distilled summaries cover the rest)
        run: |
          mkdir -p data/reference data/knowledge
          [ -s data/reference/chrM.fa.gz ] || curl -sL --fail -o data/reference/chrM.fa.gz https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chrM.fa.gz
          [ -s data/reference/chr21.fa.gz ] || curl -sL --fail -o data/reference/chr21.fa.gz https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chr21.fa.gz
          [ -s data/knowledge/go-basic.obo ] || curl -sL --fail -o data/knowledge/go-basic.obo https://current.geneontology.org/ontology/go-basic.obo
          [ -s data/knowledge/goa_human.gaf.gz ] || curl -sL --fail -o data/knowledge/goa_human.gaf.gz https://current.geneontology.org/annotations/goa_human.gaf.gz
          [ -s data/knowledge/cl-basic.obo ] || curl -sL --fail -o data/knowledge/cl-basic.obo http://purl.obolibrary.org/obo/cl/cl-basic.obo
      - name: Test
        run: uv run --no-sync pytest -q -rs
      # pyproject's rule, enforced where it can be: "the engine and the CLI must import with no
      # third-party package present". `bio` is an entry point of that engine, and here it has nothing
      # but the dev group to import from.
      - name: BioLang programs test themselves
        run: uv run --no-sync bio test data/demo genomeos/std data/organisms

  # The readers that reach the outside world are gated behind env vars, so they run nowhere: three
  # tests that read Zoonomia and gnomAD Gnocchi by HTTP range and UniProt/AlphaFold by API. Those are
  # exactly the readers that rot silently when a URL or a file format changes, which has happened to
  # this project twice (Ensembl's homology dump without mouse; ENCODE's per-strand labels). One daily
  # advisory run is the cheapest way to hear about it from the project rather than from a wrong number.
  #
  # continue-on-error: an outage at UCSC is not a defect in this repository, and a scheduled job that
  # goes red on someone else's downtime trains everyone to ignore it. It reports; it does not gate.
  # The AlphaGenome live test stays out: it needs a paid key as a secret, which is Albert's decision.
  live-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Read the outside world
        env:
          GENOMEOS_LIVE: "1"
          GENOMEOS_NET: "1"
        run: uv run pytest -q -rs tests/test_attribution.py tests/test_variation.py tests/test_molecules.py
