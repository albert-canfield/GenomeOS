[project]
name = "genomeos"
version = "1.0.0"
description = "GenomeOS: an executable model of biology. Genome + biological libraries + runtime."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
# Two licences, by path: the BioLang engine (genomeos/lang, ir, runtime, std,
# coords.py, bio.py) is Apache-2.0; the GenomeOS application is AGPL-3.0-or-later.
# The map is in LICENSING.md; SPDX headers mark the package entry points.
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
genomeos = "genomeos.cli:main"
bio = "genomeos.bio:main"

# the BioLang engine looks here for `import <scheme>:NAME` sources it does not ship (genomeos/lang/parser.py)
[project.entry-points."biolang_import_resolvers"]
protein = "genomeos.lib.biolang:resolve_protein"

[project.optional-dependencies]
compose = [
    "process-bigraph>=1.8.4",
]
clocks = [
    "biolearn>=0.9.1",
]
predict = [
    "alphagenome>=0.9.0",
]
hla = [
    # MHCflurry 2 is Apache 2.0; its models are downloaded by the user with
    # `mhcflurry-downloads fetch models_class1_presentation`. NetMHCpan is not
    # installable from here: it needs a DTU licence and a local binary.
    "mhcflurry>=2.1",
]
analysis = [
    # Two modules import numpy at module level and cannot be imported without it:
    # attribution/compress.py (the bits-per-base arithmetic) and attribution/lexicon_axes.py.
    # Everywhere else numpy is imported inside the function that needs it, which is the
    # pattern to keep: the engine and the CLI must import with no third-party package present.
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.6",
    # tests/test_compress.py, test_contact_maps.py and test_lexicon_axes.py import numpy directly,
    # so without it a fresh checkout does not fail a test, it fails to COLLECT three files - which
    # reads as "no such tests" rather than as a missing dependency (genomeos-79, 2026-09-16).
    "numpy>=1.26",
    # scripts/s5_rate_ranges.py:40 imports pandas and scripts/astroreg_register.py:28 imports
    # openpyxl at module level, so ten tests that import those scripts fail with
    # ModuleNotFoundError in any checkout where nobody installed the two by hand: the seven in
    # tests/test_s5_rate_ranges.py on pandas, and the three in tests/test_code_cleanliness_shared.py
    # on openpyxl, whose module-scope fixture imports the register. They belong here and not in
    # [project.dependencies]: the core stays dependency-free, and these serve scripts and tests only.
    # Licences are permissive, read from the installed metadata rather than taken on report:
    # pandas BSD-3-Clause, openpyxl MIT, and the three they pull in - et-xmlfile MIT,
    # python-dateutil dual Apache-2.0/BSD-3-Clause, six MIT. Nothing copyleft arrives with them.
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genomeos"]

[tool.hatch.build]
# both licences, the NOTICE and the path map travel with the package
artifacts = ["LICENSE", "LICENSE-APACHE", "NOTICE", "LICENSING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # A test that cannot run without an optional extra declares which one and skips, naming it, where
    # the extra is not installed (tests/conftest.py applies it; tests/extras_lock.py reads the lock).
    # Registered here rather than in a conftest hook so that the name is known wherever pytest reads
    # this file, including a run collected from outside tests/.
    "requires_extra(name): needs the named pyproject extra (uv sync --extra <name>)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E741", "N802"]
