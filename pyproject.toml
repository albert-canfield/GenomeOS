[project]
name = "genomeos"
version = "0.1.0"
description = "GenomeOS: an executable model of biology. Genome + biological libraries + runtime."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
# Two licences, by path: the BioLang engine (genomeos/lang, ir, runtime, std,
# coords.py, bio.py) is Apache-2.0; the GenomeOS application is AGPL-3.0-or-later.
# The map is in LICENSING.md; SPDX headers mark the package entry points.
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
genomeos = "genomeos.cli:main"
bio = "genomeos.bio:main"

[project.optional-dependencies]
compose = [
    "process-bigraph>=1.8.4",
]
clocks = [
    "biolearn>=0.9.1",
]
predict = [
    "alphagenome>=0.9.0",
]
hla = [
    # MHCflurry 2 is Apache 2.0; its models are downloaded by the user with
    # `mhcflurry-downloads fetch models_class1_presentation`. NetMHCpan is not
    # installable from here: it needs a DTU licence and a local binary.
    "mhcflurry>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genomeos"]

[tool.hatch.build]
# both licences, the NOTICE and the path map travel with the package
artifacts = ["LICENSE", "LICENSE-APACHE", "NOTICE", "LICENSING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E741", "N802"]
