[project]
name = "genomeos"
version = "0.1.0"
description = "GenomeOS: an executable model of biology. Genome + biological libraries + runtime."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
genomeos = "genomeos.cli:main"
bio = "genomeos.bio:main"

[project.optional-dependencies]
compose = [
    "process-bigraph>=1.8.4",
]
clocks = [
    "biolearn>=0.9.1",
]
predict = [
    "alphagenome>=0.9.0",
]
hla = [
    # MHCflurry 2 is Apache 2.0; its models are downloaded by the user with
    # `mhcflurry-downloads fetch models_class1_presentation`. NetMHCpan is not
    # installable from here: it needs a DTU licence and a local binary.
    "mhcflurry>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genomeos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E741", "N802"]
